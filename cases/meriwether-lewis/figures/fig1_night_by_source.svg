<text x="24" y="528" fill="#8a8984" font-size="11.5">Filled marks are times the source states by the clock or by the sun; sunset, daylight and sunrise sit at their computed times.</text>
<text x="24" y="544" fill="#8a8984" font-size="11.5">Hollow marks sit where the words put them: ‘before midnight’ is drawn as 20:00 to midnight, ‘in the night’ as 20:00 to 05:00,</text>
<text x="24" y="560" fill="#8a8984" font-size="11.5">‘several hours’ of pacing as 20:30 to 04:30, and the servants Neelly says she woke as just after the shots.</text>
<text x="24" y="576" fill="#8a8984" font-size="11.5">Sources: section 2 and the table in section 4 of this report; sun and moon times from data/astronomy_1809.txt.</text>
